<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>English Coach · личный кабинет</title>
<script src="/english/assets/theme.js"></script><link rel="stylesheet" href="/english/assets/styles.css"><script src="/english/assets/app.js" defer></script></head>
<body><a class="skip-link" href="#main">Перейти к содержимому</a><aside class="sidebar" id="sidebar" aria-label="Навигация"></aside>
<div class="workspace"><header class="topbar"><button class="icon-button mobile-menu" id="menu-button" aria-label="Открыть меню" aria-expanded="false">☰</button><div class="breadcrumb">Личный кабинет <span>/</span><strong id="breadcrumb">Обзор</strong></div>
<form class="global-search" id="search-form" role="search"><input id="global-search" placeholder="Тема, фраза или урок…" aria-label="Поиск" maxlength="200"><button class="icon-button" aria-label="Найти">⌕</button></form><button class="btn soft" id="logout">Выйти</button></header>
<div class="workspace-tools"><label class="profile-picker" for="learner-profile"><span>Учебный профиль</span><select class="select" id="learner-profile" aria-label="Учебный профиль"></select></label><span class="state-note" id="access-status">Личный вход</span><label class="theme-picker" for="theme-mode"><span>Тема</span><select class="select" id="theme-mode"><option value="system">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label></div>
<main id="main" tabindex="-1"><p class="loading" role="status">Загружаем разрешённые профили…</p></main><footer class="footer">English Coach <span>Сохранённые учебные данные · разговор в тексте</span></footer></div>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div class="drawer-top"><span class="eyebrow">Подробности</span><button class="icon-button" id="close-detail" aria-label="Закрыть">✕</button></div><div id="detail-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div></body></html>
