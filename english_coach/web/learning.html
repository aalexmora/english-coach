<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Учебные профили · Learning Coach</title>
<script src="/english/assets/theme.js"></script>
<link rel="stylesheet" href="/english/assets/styles.css">
<script src="/english/assets/learning.js" defer></script>
</head>
<body>
<div class="workspace learning-workspace">
  <header class="topbar learning-topbar">
    <a href="/english" class="text-link learning-back">← English Coach</a>
    <div class="learning-theme-row">
      <label class="learning-theme-label">Тема
        <select id="learning-theme" class="select learning-theme-select">
          <option value="system">Система</option>
          <option value="light">Светлая</option>
          <option value="dark">Тёмная</option>
        </select>
      </label>
    </div>
  </header>
  <main id="main" class="learning-main">
    <h1 class="learning-heading">Учебные профили</h1>
    <p class="muted small">Разные цели, языки и планы под одной учётной записью. Данные каждого профиля изолированы.</p>
    <nav class="actions learning-nav" aria-label="Разделы">
      <button class="btn primary" id="profiles-tab" data-tab="profiles" aria-current="page">Профили</button>
      <button class="btn soft" id="jobs-tab" data-tab="jobs">Задания методолога</button>
    </nav>
    <div id="learning-content" role="status">Загружаем…</div>
    <p id="learning-error" class="form-error" role="alert"></p>
  </main>
</div>
</body>
</html>
